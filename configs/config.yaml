# configs/config.yaml

# Prefer using random_seeds for experiments; keep SEED only if some trainer reads it.
SEED: 42
random_seeds: [42, 43, 44]

DATA_DIR: "/home/bruno.fonkeng/gencys/data/USTC-TFC2016_malware_nhwc"

paths:
  # Choose ONE approach:
  # If you symlink repo ./artifacts -> ~/gencys/artifacts, set this to "artifacts"
  # artifacts: "artifacts"
  artifacts: "/home/bruno.fonkeng/gencys/artifacts"
  summaries_dir: "/home/bruno.fonkeng/gencys/artifacts/summaries"

IMG_SHAPE: [40, 40, 1]
NUM_CLASSES: 9

# IMPORTANT: keep consistent with your actual preprocessing across ALL families
# If your pipeline is [-1, 1], do not leave this at [0, 1]
scale: [-1, 1]

synth:
  # This is a smoke-test budget. For real runs, override to 200/500/1000/2000.
  n_per_class: 25

evaluator:
  per_class_cap: 200
  save_grids: true
  save_nn_stats: true
  compute_fid: true
  compute_cfid: true
  feature_extractor: "domain"
  fid_split: "val"
  domain_encoder: "malware_encoder_v1"

# Enforce Option A going forward (ONLY if eval/runner.py injects run_meta at runtime)
provenance:
  require: true
  
run_meta:
  num_real: 90000

# Early-stop is only used if your training loop supports it; otherwise harmless.
early_stop:
  metric: "cFID_mean"
  minimize: true
  delta: 0.5
  patience: 4
  eval_every_steps: 2000

# =========================
# Model-specific blocks
# =========================
diffusion:
  LR: 2.0e-4
  BATCH: 256
  EMA: 0.9999
  SCHEDULE: cosine
  TIMESTEPS: 1000
  BASE_FILTERS: 64
  DEPTH: 2
  TIME_EMB_DIM: 128
  TOTAL_STEPS: 200000
  SAMPLER_STEPS: 200
  GUIDANCE_WEIGHT: 1.5

gan:
  LR_G: 1.0e-4
  LR_D: 2.0e-4
  BETAS: [0.5, 0.999]
  D_UPDATES_PER_G: 2
  BATCH: 128
  TOTAL_STEPS: 150000
  REG: "R1"
  SPECTRAL_NORM: true
  EMA:
    ENABLED: true
    DECAY: 0.999

vae:
  LR: 1.0e-3
  BATCH: 256
  BETA: 1.0
  KL_WARMUP_STEPS: 2000
  TOTAL_STEPS: 80000

autoregressive:
  LR: 1.0e-3
  BATCH: 256
  TOTAL_STEPS: 100000
  SAMPLING:
    TEMPERATURE: 0.95
    TOP_K: 100
    TOP_P: 0.95

restrictedboltzmann:
  LR: 5.0e-4
  CD_K: 5
  HIDDEN: 512
  BATCH: 256
  EPOCHS: 50
  PER_CLASS_CAP: 25

gaussianmixture:
  GMM_COMPONENTS: 5
  GMM_COVARIANCE: diag
  GMM_REG_COVAR: 1e-3
  GMM_MAX_ITER: 300
  GMM_TRAIN_GLOBAL: true

maskedautoflow:
  LR: 1.0e-3
  BATCH: 256
  DEPTH: 8
  WIDTH: 256
  TOTAL_STEPS: 80000
  DEQUANT_NOISE: 0.01
