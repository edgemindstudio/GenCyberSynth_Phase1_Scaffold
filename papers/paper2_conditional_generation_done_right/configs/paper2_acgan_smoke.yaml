run_meta:
  paper_id: paper2
  config_id: paper2_acgan_smoke
  # optional but nice to keep consistent:
  dataset_id: ustc_tfc2016

paths:
  artifacts: artifacts   # will be overridden by --artifacts in your run command
  
DATA_DIR: /home/bruno.fonkeng/gencys/data/USTC-TFC2016_malware_nhwc

# Keep synth small for the first test
synth:
  seed: 42
  n_per_class: 10

# Keep eval light for the first test
evaluator:
  per_class_cap: 50
  
train:
  epochs: 1
  batch_size: 64

model_variant: acgan_auxloss


acgan:

  enabled: true

  validity_loss_weight: 1.0

  class_loss_weight: 1.0

